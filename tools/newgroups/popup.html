<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tích Bạn Bè Vô Group</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="stylesheet" href="../embedded-dark.css">
</head>
<body>
  <main>
    <h1>Tích Bạn Bè Vô Group</h1>

    <label for="limit">Số người muốn tick</label>
    <input id="limit" type="number" min="1" max="500" step="1" value="20">

    <label for="delay">Độ trễ mỗi lần tick (ms)</label>
    <input id="delay" type="number" min="200" max="5000" step="100" value="700">

    <div class="actions">
      <button id="start" type="button">Lọc và tick</button>
      <button id="stop" class="danger" type="button">Dừng</button>
    </div>

    <button id="cleanup" class="secondary" type="button">Bỏ chọn người lỗi</button>

    <p id="status" role="status">Mở cửa sổ mời bạn bè trên Facebook, rồi bấm Lọc và tick.</p>
    <p class="note">Tiện ích bỏ qua người đã mời, đã tham gia, bị lỗi hoặc không mời được.</p>
  </main>

  <script src="popup.js"></script>
  <script src="../theme-sync.js"></script>
</body>
</html>
